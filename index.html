<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma Retreats — Dashboard Proprietari</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-box{background:#fff;border-radius:16px;border:0.5px solid #e0dfd8;padding:2rem;width:100%;max-width:380px}
.logo-icon{width:36px;height:36px;border-radius:8px;background:#5B2D8E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
label{font-size:13px;color:#5f5e5a;display:block;margin-bottom:6px}
input{width:100%;padding:9px 12px;border:0.5px solid #d3d1c7;border-radius:8px;font-size:14px;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s}
input:focus{border-color:#5B2D8E}
.field{margin-bottom:16px}
.btn{width:100%;padding:10px;background:#5B2D8E;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:#3D1A6E}
.err{color:#A32D2D;font-size:12px;margin-top:10px;display:none}
.app{display:none}
.sidebar{width:220px;background:#fff;border-right:0.5px solid #e0dfd8;min-height:100vh;padding:1.25rem 1rem;position:fixed;top:0;left:0;z-index:10}
.main{margin-left:220px;padding:1.5rem;max-width:1000px}
.s-label{font-size:10px;color:#888780;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px;font-weight:500;display:block}
.apt-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px;color:#5f5e5a;margin-bottom:2px}
.apt-item:hover{background:#f5f5f3}
.apt-item.active{background:#F0E6F6;color:#5B2D8E;font-weight:500}
.apt-dot{width:8px;height:8px;border-radius:50%;background:#d3d1c7;flex-shrink:0}
.apt-item.active .apt-dot{background:#5B2D8E}
.s-footer{position:absolute;bottom:1.25rem;left:1rem;right:1rem}
.avatar{width:28px;height:28px;border-radius:50%;background:#F0E6F6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#5B2D8E;flex-shrink:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#f5f5f3;border-radius:8px;padding:14px 16px}
.metric.green{background:#EAF3DE}
.ml{font-size:11px;color:#888780;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.metric.green .ml{color:#3B6D11}
.mv{font-size:21px;font-weight:500}
.md{font-size:11px;margin-top:3px}
.up{color:#1D9E75}.dn{color:#D85A30}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#fff;border:0.5px solid #e0dfd8;border-radius:12px;padding:16px;margin-bottom:14px}
.ct{font-size:12px;color:#888780;text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:#888780}
.legend span{display:flex;align-items:center;gap:5px}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}
.brow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:0.5px solid #e0dfd8;font-size:13px}
.brow:last-child{border-bottom:none}
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.tg{background:#EAF3DE;color:#3B6D11}
.tb{background:#F0E6F6;color:#5B2D8E}
.ta{background:#FFE0D3;color:#993C1D}
.tbk{background:#F0E6F6;color:#3D1A6E}
.loading{text-align:center;padding:3rem;color:#888780;font-size:14px}
.bdrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;color:#5f5e5a;border-bottom:0.5px solid #f0efe8}
.bdrow:last-child{border-bottom:none}
.bdrow.neg span:last-child{color:#D85A30}
.bdrow.total{font-weight:500;font-size:14px;color:#1a1a18;border-top:1px solid #e0dfd8;margin-top:4px;padding-top:10px;border-bottom:none}
.bdrow.total span:last-child{color:#1D9E75;font-size:16px}
@media(max-width:680px){.sidebar{display:none}.main{margin-left:0;padding:1rem}.charts-grid{grid-template-columns:1fr}.brow{grid-template-columns:1fr auto}}
</style>
</head>

// Genera etichette mesi: 12 passati + mese corrente + 5 futuri = 18 mesi
// Indice 11 = mese corrente
const TOTAL_MONTHS = 18;
const CUR_IDX = 11;

function buildMonthLabels() {
  const now = new Date();
  const labels = [];
  const mNames = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
  for(let i=CUR_IDX; i>=0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    labels.push(mNames[d.getMonth()]+" '"+String(d.getFullYear()).slice(2));
  }
  for(let i=1; i<=TOTAL_MONTHS-CUR_IDX-1; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    labels.push(mNames[d.getMonth()]+" '"+String(d.getFullYear()).slice(2));
  }
  return labels;
}

// Restituisce il mese-indice (0-17) rispetto alla finestra 18 mesi, CUR_IDX = mese corrente
function getMonthIndex(dateStr) {
  const now = new Date();
  const parts = String(dateStr).split(/[-T]/);
  const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2])||1);
  if(isNaN(d.getTime())) return -1;
  const diffMonths = (now.getFullYear()-d.getFullYear())*12 + now.getMonth()-d.getMonth();
  const idx = CUR_IDX - diffMonths;
  return (idx >= 0 && idx < TOTAL_MONTHS) ? idx : -1;
}

// Calcolo per singola prenotazione (no commissione Prisma — quella è mensile)
function calcPrenotazione(price, channelName, cleaningFee, fiscal) {
  const lordo = Number(price)||0;
  const isSRL = fiscal.regime==="srl";
  const ch = (channelName||"").toLowerCase();
  let commPortale = 0;
  if(ch.includes("airbnb"))        commPortale = lordo*(isSRL?AIRBNB_SRL:AIRBNB);
  else if(ch.includes("booking"))  commPortale = lordo*(isSRL?BOOKING_SRL:BOOKING);
  const cedolare  = fiscal.regime==="cedolare" ? lordo*(fiscal.cedolare||0.21) : 0;
  const pulizie   = fiscal.pulizie ? (Number(cleaningFee)||0) : 0;
  return {lordo, commPortale, cedolare, pulizie};
}

const MFL = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

// Dato un apartment id, restituisce il fiscal del proprietario corretto
function getFiscalForApt(aptId){
  if(S.user.role!=="admin") return S.user.fiscal||{regime:"admin",gestione:0};
  for(const [email,u] of Object.entries(USERS)){
    if(u.apartments && u.apartments.includes(aptId)) return u.fiscal;
  }
  return {regime:"admin",gestione:0};
}

function fmtE(n){return "€"+Math.round(n).toLocaleString("it");}
function fmtDE(a,b){const d=a-b;return(d>=0?"+":"")+"€"+Math.abs(Math.round(d)).toLocaleString("it");}
function fmtPt(a,b){const d=a-b;return(d>=0?"+":"")+Math.round(d)+"pt";}

function doLogin(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass=document.getElementById("loginPass").value;
  const u=USERS[email];
  if(!u||u.password!==pass){document.getElementById("loginErr").style.display="block";return;}
  S.user={...u,email};
  document.getElementById("loginErr").style.display="none";
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appScreen").style.display="block";
  document.getElementById("userName").textContent=u.name;
  document.getElementById("userAvatar").textContent=u.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  loadApts();
}

function logout(){
  S={user:null,apts:[],cur:null,charts:[]};
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("appScreen").style.display="none";
  document.getElementById("loginEmail").value="";
  document.getElementById("loginPass").value="";
}

async function api(ep){const r=await fetch(`/api/smoobu?endpoint=${encodeURIComponent(ep)}`);if(!r.ok)throw new Error("API error");return r.json();}

async function loadApts(){
  try{
    const d=await api("apartments");
    let apts=(d.apartments||[]).map(a=>({id:String(a.id),name:a.name||"Appartamento"}));
    if(S.user.apartments) apts=apts.filter(a=>S.user.apartments.includes(a.id));
    S.apts=apts;S.cur=apts[0]||null;
    renderSidebar();
    if(S.cur)loadDash(S.cur);
  }catch(e){document.getElementById("mainContent").innerHTML=`<div class="loading">Errore: ${e.message}</div>`;}
}

function renderSidebar(){
  document.getElementById("aptList").innerHTML=S.apts.map(a=>`
    <div class="apt-item${a.id===S.cur?.id?" active":""}" onclick="switchApt('${a.id}')">
      <div class="apt-dot"></div>${a.name}</div>`).join("");
}

function switchApt(id){S.cur=S.apts.find(a=>a.id===id);renderSidebar();loadDash(S.cur);}

async function loadDash(apt){
  S.charts.forEach(c=>{try{c.destroy()}catch(e){}});S.charts=[];
  document.getElementById("mainContent").innerHTML=`<div class="loading">Caricamento dati per ${apt.name}...</div>`;
  const now=new Date();
  const from=new Date(now);from.setMonth(from.getMonth()-11);
  // Periodo anno scorso: carica tutto il mese corrispondente
  const yoyFrom=new Date(now.getFullYear()-1, now.getMonth(), 1);
  const yoyEnd=new Date(now.getFullYear()-1, now.getMonth()+1, 0);
  const f=d=>d.toISOString().slice(0,10);
  try{
    // Carica tutte le prenotazioni (da -11 mesi in poi, include future)
    let allBookings=[];
    let page=1;
    let hasMore=true;
    while(hasMore){
      const d=await api(`reservations?apartmentId=${apt.id}&arrivalFrom=${f(from)}&departureFrom=${f(from)}&pageSize=100&page=${page}`);
      const bookings=d.bookings||[];
      allBookings=allBookings.concat(bookings);
      if(bookings.length<100) hasMore=false;
      else page++;
    }
    // Carica prenotazioni anno scorso per YoY (dal 1° del mese YoY in poi)
    let yoyRaw=[];
    page=1; hasMore=true;
    while(hasMore){
      const d=await api(`reservations?apartmentId=${apt.id}&arrivalFrom=${f(yoyFrom)}&departureFrom=${f(yoyFrom)}&pageSize=100&page=${page}`);
      const bookings=d.bookings||[];
      yoyRaw=yoyRaw.concat(bookings);
      if(bookings.length<100) hasMore=false;
      else page++;
    }
    // Filtra lato client: solo prenotazioni con arrivo nel mese YoY
    const yoyMonth=yoyFrom.getMonth(), yoyYear=yoyFrom.getFullYear();
    const yoyBookings=yoyRaw.filter(b=>{
      const parts=String(b.arrival).split(/[-T]/);
      const m=Number(parts[1])-1, y=Number(parts[0]);
      return m===yoyMonth && y===yoyYear;
    });
    renderDash(apt,allBookings,yoyBookings);
  }catch(e){document.getElementById("mainContent").innerHTML=`<div class="loading">Errore: ${e.message}</div>`;}
}

// Calcola notti dalla differenza tra arrival e departure
function calcNights(arrival, departure){
  const a=new Date(arrival), d=new Date(departure);
  if(isNaN(a.getTime())||isNaN(d.getTime())) return 0;
  return Math.max(0, Math.round((d-a)/(1000*60*60*24)));
}

function renderDash(apt, bookings, yoyBookings){
  const now=new Date();
  const fiscal=getFiscalForApt(apt.id);
  const monthLabels=buildMonthLabels();

  // Aggregazione per i 18 mesi
  const mLordo=Array(TOTAL_MONTHS).fill(0), mCommP=Array(TOTAL_MONTHS).fill(0);
  const mCed=Array(TOTAL_MONTHS).fill(0), mPul=Array(TOTAL_MONTHS).fill(0), mNights=Array(TOTAL_MONTHS).fill(0);

  bookings.forEach(b=>{
    if(!b.price||Number(b.price)<=0) return;
    const mi=getMonthIndex(b.arrival);
    if(mi<0) return;
    const r=calcPrenotazione(b.price,b.channel?.name||"",b.cleaning_fee||0,fiscal);
    mLordo[mi]+=r.lordo;
    mCommP[mi]+=r.commPortale;
    mCed[mi]+=r.cedolare;
    mPul[mi]+=r.pulizie;
    const nights=calcNights(b.arrival, b.departure);
    mNights[mi]+=nights;
  });

  // YoY: calcola lordo e netto dello stesso mese dell'anno scorso
  let yoyLordo=0, yoyCommP=0, yoyCed=0, yoyPul=0, yoyCommG=0;
  (yoyBookings||[]).forEach(b=>{
    if(!b.price||Number(b.price)<=0) return;
    const r=calcPrenotazione(b.price,b.channel?.name||"",b.cleaning_fee||0,fiscal);
    yoyLordo+=r.lordo;
    yoyCommP+=r.commPortale;
    yoyCed+=r.cedolare;
    yoyPul+=r.pulizie;
  });
  yoyCommG=(yoyLordo-yoyCommP-yoyCed)*(fiscal.gestione||0);
  const yoySpese=yoyCommP+yoyCed+yoyPul+yoyCommG;
  const yoyNetto=yoyLordo-yoySpese;

  // Commissione Prisma calcolata sul netto dopo commissioni portali e cedolare secca
  const mCommG = mLordo.map((l,i)=>(l - mCommP[i] - mCed[i])*(fiscal.gestione||0));
  // Spese totali mensili
  const mSpese = mLordo.map((l,i)=>mCommP[i]+mCed[i]+mPul[i]+mCommG[i]);
  // Netto mensile
  const mNetto = mLordo.map((l,i)=>l-mSpese[i]);
  const mOcc   = mNights.map(n=>Math.min(100,Math.round((n/30)*100)));

  const round=arr=>arr.map(v=>Math.round(v));
  const revD=round(mLordo), netD=round(mNetto), speseD=round(mSpese);
  const commPD=round(mCommP), cedD=round(mCed), commGD=round(mCommG), pulD=round(mPul);

  // Mese corrente = CUR_IDX, precedente = CUR_IDX-1
  const lr=revD[CUR_IDX], ln=netD[CUR_IDX], lo=mOcc[CUR_IDX];
  const pr=revD[CUR_IDX-1], pn=netD[CUR_IDX-1], po=mOcc[CUR_IDX-1];
  const tCommP=commPD[CUR_IDX], tCed=cedD[CUR_IDX], tCommG=commGD[CUR_IDX], tPul=pulD[CUR_IDX], tSpese=speseD[CUR_IDX];

  const curMonthName=MFL[now.getMonth()]+" "+now.getFullYear();
  const yoyMonthName=MFL[now.getMonth()]+" "+(now.getFullYear()-1);
  const regLabel=fiscal.regime==="cedolare"?"Cedolare secca 21%":fiscal.regime==="forfettario"?"Regime forfettario":fiscal.regime==="srl"?"SRL":"";

  // Riepilogo economico completo con confronto YoY
  let bdRows=`
    <div class="bdrow"><span>Entrate lorde</span><span style="font-weight:500">${fmtE(lr)}</span></div>
    <div class="bdrow neg"><span>Commissioni portali (Airbnb 18,91% / Booking 23,79%)</span><span>-${fmtE(tCommP)}</span></div>`;
  if(fiscal.regime==="cedolare")
    bdRows+=`<div class="bdrow neg"><span>Cedolare secca 21% (trattenuta dal portale sul lordo)</span><span>-${fmtE(tCed)}</span></div>`;
  if(fiscal.pulizie)
    bdRows+=`<div class="bdrow neg"><span>Spese pulizie (da Smoobu)</span><span>-${fmtE(tPul)}</span></div>`;
  bdRows+=`<div class="bdrow neg"><span>Commissione gestione Prisma Retreats (${Math.round((fiscal.gestione||0)*100)}% sul netto portali)</span><span>-${fmtE(tCommG)}</span></div>`;
  bdRows+=`<div class="bdrow"><span style="color:#888780;font-size:12px">Totale spese e trattenute</span><span style="color:#D85A30">-${fmtE(tSpese)}</span></div>`;
  bdRows+=`<div class="bdrow total"><span>Netto proprietario</span><span>${fmtE(ln)}</span></div>`;

  // Confronto anno su anno
  const yoyDiffLordo=lr-Math.round(yoyLordo);
  const yoyDiffNetto=ln-Math.round(yoyNetto);
  bdRows+=`<div style="margin-top:14px;padding-top:12px;border-top:0.5px solid #e0dfd8">
    <div style="font-size:11px;color:#888780;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;font-weight:500">Confronto con ${yoyMonthName}</div>
    <div class="bdrow"><span>Lordo ${yoyMonthName}</span><span style="font-weight:500">${fmtE(Math.round(yoyLordo))}</span></div>
    <div class="bdrow"><span>Lordo ${curMonthName}</span><span style="font-weight:500">${fmtE(lr)}</span></div>
    <div class="bdrow"><span>Differenza lordo</span><span class="${yoyDiffLordo>=0?'up':'dn'}" style="font-weight:500">${yoyDiffLordo>=0?'+':''}${fmtE(Math.abs(yoyDiffLordo))}</span></div>
    <div class="bdrow"><span>Netto ${yoyMonthName}</span><span style="font-weight:500">${fmtE(Math.round(yoyNetto))}</span></div>
    <div class="bdrow"><span>Netto ${curMonthName}</span><span style="font-weight:500">${fmtE(ln)}</span></div>
    <div class="bdrow"><span>Differenza netto</span><span class="${yoyDiffNetto>=0?'up':'dn'}" style="font-weight:500">${yoyDiffNetto>=0?'+':''}${fmtE(Math.abs(yoyDiffNetto))}</span></div>
  </div>`;

  // Prenotazioni future
  const upcoming=bookings.filter(b=>new Date(b.departure)>=now).sort((a,b)=>new Date(a.arrival)-new Date(b.arrival)).slice(0,6);
  const fd2=s=>{const d=new Date(s);return d.getDate()+" "+["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"][d.getMonth()];};
  const isAct=b=>new Date(b.arrival)<=now&&new Date(b.departure)>=now;
  const chN=b=>b.channel?.name||"Diretto";

  const bHtml=upcoming.length?upcoming.map(b=>`
    <div class="brow">
      <div><div style="font-weight:500">${b.firstname||""} ${b.lastname||""}</div>
      <div style="font-size:11px;color:#888780">${fd2(b.arrival)} → ${fd2(b.departure)} · ${calcNights(b.arrival,b.departure)} notti</div></div>
      <div><span class="tag ${chN(b).toLowerCase().includes('airbnb')?'ta':'tbk'}">${chN(b)}</span></div>
      <div style="font-weight:500">${fmtE(Number(b.price||0))} <span style="font-size:10px;color:#888780;font-weight:400">lordo</span></div>
      <div><span class="tag ${isAct(b)?'tg':'tb'}">${isAct(b)?'In corso':'Confermata'}</span></div>
    </div>`).join(""):`<p style="font-size:13px;color:#888780;padding:10px 0">Nessuna prenotazione trovata</p>`;

  document.getElementById("mainContent").innerHTML=`
    <div style="font-size:20px;font-weight:500;margin-bottom:4px">${apt.name}</div>
    <p style="font-size:13px;color:#888780;margin-bottom:20px">
      <span style="background:#EAF3DE;color:#3B6D11;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500">Live</span>
      ${regLabel?`<span style="background:#F0E6F6;color:#5B2D8E;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;margin-left:6px">${regLabel}</span>`:""}
      <span style="margin-left:6px">Smoobu · ${curMonthName}</span>
    </p>

    <div class="metrics">
      <div class="metric"><div class="ml">Entrate lorde</div><div class="mv">${fmtE(lr)}</div><div class="md ${lr>=pr?'up':'dn'}">${fmtDE(lr,pr)} vs mese prec.</div></div>
      <div class="metric"><div class="ml">Comm. portali</div><div class="mv">${fmtE(tCommP)}</div><div class="md" style="color:#888780">Airbnb / Booking</div></div>
      ${fiscal.regime==="cedolare"?`<div class="metric"><div class="ml">Cedolare secca</div><div class="mv">${fmtE(tCed)}</div><div class="md" style="color:#888780">21% sul lordo</div></div>`:""}
      ${fiscal.pulizie?`<div class="metric"><div class="ml">Pulizie</div><div class="mv">${fmtE(tPul)}</div><div class="md" style="color:#888780">Da Smoobu</div></div>`:""}
      <div class="metric"><div class="ml">Gestione Prisma</div><div class="mv">${fmtE(tCommG)}</div><div class="md" style="color:#888780">${Math.round((fiscal.gestione||0)*100)}% sul netto portali</div></div>
      <div class="metric green"><div class="ml">Netto proprietario</div><div class="mv" style="color:#1D9E75">${fmtE(ln)}</div><div class="md ${ln>=pn?'up':'dn'}">${fmtDE(ln,pn)} vs mese prec.</div></div>
      <div class="metric"><div class="ml">Occupazione</div><div class="mv">${lo}%</div><div class="md ${lo>=po?'up':'dn'}">${fmtPt(lo,po)} vs mese prec.</div></div>
    </div>

    <div class="card">
      <div class="ct">Riepilogo economico — ${curMonthName}</div>
      ${bdRows}
    </div>

    <div class="charts-grid">
      <div class="card" style="margin-bottom:0"><div class="ct">Occupazione (%)</div><div style="position:relative;height:180px"><canvas id="occChart" role="img" aria-label="Occupazione">Dati occupazione.</canvas></div></div>
      <div class="card" style="margin-bottom:0">
        <div class="legend"><span><span class="ldot" style="background:#5B2D8E"></span>Lordo</span><span><span class="ldot" style="background:#D85A30"></span>Spese totali</span><span><span class="ldot" style="background:#1D9E75"></span>Netto</span><span><span class="ldot" style="background:rgba(91,45,142,0.2);border:1px dashed #5B2D8E"></span>Previsione</span></div>
        <div class="ct">Lordo vs spese vs netto (€)</div>
        <div style="position:relative;height:180px"><canvas id="revChart" role="img" aria-label="Lordo spese netto">Dati.</canvas></div>
      </div>
    </div>
    <div style="margin-bottom:14px"></div>

    <div class="card">
      <div class="ct">Prenotazioni in corso e prossime</div>
      ${bHtml}
    </div>`;

  requestAnimationFrame(()=>{
    // Colori per barre: solidi per passato/corrente, più chiari per futuro
    const occBg = mOcc.map((_,i)=>i<=CUR_IDX?"rgba(91,45,142,0.07)":"rgba(91,45,142,0.03)");
    const occBorder = mOcc.map((_,i)=>i<=CUR_IDX?"#5B2D8E":"rgba(91,45,142,0.4)");
    const revBg = revD.map((_,i)=>i<=CUR_IDX?"rgba(91,45,142,0.45)":"rgba(91,45,142,0.2)");
    const speseBg = speseD.map((_,i)=>i<=CUR_IDX?"rgba(216,90,48,0.6)":"rgba(216,90,48,0.25)");

    S.charts.push(new Chart(document.getElementById("occChart"),{
      type:"line",
      data:{labels:monthLabels,datasets:[{data:mOcc,borderColor:occBorder,backgroundColor:"rgba(91,45,142,0.07)",tension:0.4,fill:true,pointRadius:2,pointBackgroundColor:occBorder,segment:{borderDash:ctx=>ctx.p0DataIndex>=CUR_IDX?[5,3]:undefined,borderColor:ctx=>ctx.p0DataIndex>=CUR_IDX?"rgba(91,45,142,0.4)":"#5B2D8E"}}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},annotation:false},scales:{y:{min:0,max:100,ticks:{callback:v=>v+"%",font:{size:10},color:"#888780"},grid:{color:"rgba(0,0,0,0.05)"}},x:{ticks:{font:{size:10},color:"#888780",autoSkip:false,maxRotation:45},grid:{display:false}}}}
    }));
    S.charts.push(new Chart(document.getElementById("revChart"),{
      type:"bar",
      data:{labels:monthLabels,datasets:[
        {data:revD,backgroundColor:revBg,borderRadius:2,borderSkipped:false,label:"Lordo"},
        {data:speseD,backgroundColor:speseBg,borderRadius:2,borderSkipped:false,label:"Spese"},
        {data:netD,type:"line",borderColor:"#1D9E75",backgroundColor:"transparent",tension:0.4,pointRadius:2,pointBackgroundColor:netD.map((_,i)=>i<=CUR_IDX?"#1D9E75":"rgba(29,158,117,0.4)"),label:"Netto",segment:{borderDash:ctx=>ctx.p0DataIndex>=CUR_IDX?[5,3]:undefined,borderColor:ctx=>ctx.p0DataIndex>=CUR_IDX?"rgba(29,158,117,0.4)":"#1D9E75"}}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"€"+(v/1000).toFixed(1)+"k",font:{size:10},color:"#888780"},grid:{color:"rgba(0,0,0,0.05)"}},x:{ticks:{font:{size:10},color:"#888780",autoSkip:false,maxRotation:45},grid:{display:false}}}}
    }));
  });
}
</script>
</body>
</html>
