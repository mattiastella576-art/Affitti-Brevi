<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma Retreats — Dashboard Proprietari</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-box{background:#fff;border-radius:16px;border:0.5px solid #e0dfd8;padding:2rem;width:100%;max-width:380px}
.logo-icon{width:36px;height:36px;border-radius:8px;background:#185FA5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
label{font-size:13px;color:#5f5e5a;display:block;margin-bottom:6px}
input{width:100%;padding:9px 12px;border:0.5px solid #d3d1c7;border-radius:8px;font-size:14px;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s}
input:focus{border-color:#185FA5}
.field{margin-bottom:16px}
.btn{width:100%;padding:10px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:#0C447C}
.err{color:#A32D2D;font-size:12px;margin-top:10px;display:none}
.app{display:none}
.sidebar{width:220px;background:#fff;border-right:0.5px solid #e0dfd8;min-height:100vh;padding:1.25rem 1rem;position:fixed;top:0;left:0}
.main{margin-left:220px;padding:1.5rem;max-width:960px}
.s-label{font-size:10px;color:#888780;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px;font-weight:500;display:block}
.apt-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px;color:#5f5e5a;margin-bottom:2px}
.apt-item:hover{background:#f5f5f3}
.apt-item.active{background:#E6F1FB;color:#185FA5;font-weight:500}
.apt-dot{width:8px;height:8px;border-radius:50%;background:#d3d1c7;flex-shrink:0}
.apt-item.active .apt-dot{background:#185FA5}
.s-footer{position:absolute;bottom:1.25rem;left:1rem;right:1rem}
.avatar{width:28px;height:28px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#185FA5;flex-shrink:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#f5f5f3;border-radius:8px;padding:14px 16px}
.ml{font-size:11px;color:#888780;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.mv{font-size:22px;font-weight:500}
.md{font-size:11px;margin-top:3px}
.up{color:#1D9E75}.dn{color:#D85A30}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#fff;border:0.5px solid #e0dfd8;border-radius:12px;padding:16px}
.ct{font-size:12px;color:#888780;text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:#888780}
.legend span{display:flex;align-items:center;gap:5px}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}
.brow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:0.5px solid #e0dfd8;font-size:13px}
.brow:last-child{border-bottom:none}
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.tg{background:#EAF3DE;color:#3B6D11}
.tb{background:#E6F1FB;color:#185FA5}
.ta{background:#FFE0D3;color:#993C1D}
.tbk{background:#E6F1FB;color:#0C447C}
.loading{text-align:center;padding:3rem;color:#888780;font-size:14px}
@media(max-width:680px){.sidebar{display:none}.main{margin-left:0;padding:1rem}.charts-grid{grid-template-columns:1fr}.brow{grid-template-columns:1fr auto}}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px">
      <div class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div><div style="font-size:15px;font-weight:500">Prisma Retreats</div><div style="font-size:11px;color:#888780">Dashboard proprietari</div></div>
    </div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="tua@email.it" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn" onclick="doLogin()">Accedi</button>
    <div class="err" id="loginErr">Email o password non corretti</div>
  </div>
</div>

<div class="app" id="appScreen">
  <div class="sidebar">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:28px">
      <div class="logo-icon" style="width:30px;height:30px;border-radius:7px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <span style="font-size:13px;font-weight:500">Prisma Retreats</span>
    </div>
    <span class="s-label">Appartamenti</span>
    <div id="aptList"></div>
    <div class="s-footer">
      <div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#f5f5f3">
        <div class="avatar" id="userAvatar"></div>
        <div style="overflow:hidden"><div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="userName"></div><div style="font-size:11px;color:#888780;cursor:pointer" onclick="logout()">Esci</div></div>
      </div>
    </div>
  </div>
  <div class="main" id="mainContent"><div class="loading">Caricamento...</div></div>
</div>

<script>
// ── UTENTI — modifica qui per aggiungere proprietari reali ──────────────────
const USERS = {
  "admin@prismaretreats.it":{ password:"admin2025", role:"admin", name:"Admin Prisma", apartments:null },
  "proprietario1@email.it":{ password:"pass1234", role:"owner", name:"Nome Proprietario 1", apartments:["123456"] },
  "proprietario2@email.it":{ password:"pass5678", role:"owner", name:"Nome Proprietario 2", apartments:["234567","345678"] }
};
// ───────────────────────────────────────────────────────────────────────────

const MN = ["Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic","Gen","Feb","Mar","Apr"];
const MF = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
let S = { user:null, apts:[], cur:null, charts:[] };

function doLogin(){
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass = document.getElementById("loginPass").value;
  const u = USERS[email];
  if(!u||u.password!==pass){ document.getElementById("loginErr").style.display="block"; return; }
  S.user = {...u, email};
  document.getElementById("loginErr").style.display="none";
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appScreen").style.display="block";
  document.getElementById("userName").textContent = u.name;
  document.getElementById("userAvatar").textContent = u.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  loadApts();
}

function logout(){
  S={user:null,apts:[],cur:null,charts:[]};
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("appScreen").style.display="none";
  document.getElementById("loginEmail").value="";
  document.getElementById("loginPass").value="";
}

async function api(ep){ const r=await fetch(`/api/smoobu?endpoint=${encodeURIComponent(ep)}`); if(!r.ok)throw new Error("API error"); return r.json(); }

async function loadApts(){
  try{
    const d = await api("apartments");
    let apts = (d.apartments||[]).map(a=>({id:String(a.id),name:a.name||"Appartamento"}));
    if(S.user.apartments) apts=apts.filter(a=>S.user.apartments.includes(a.id));
    S.apts=apts; S.cur=apts[0]||null;
    renderSidebar();
    if(S.cur) loadDash(S.cur);
  }catch(e){ document.getElementById("mainContent").innerHTML=`<div class="loading">Errore caricamento appartamenti.<br><small>${e.message}</small></div>`; }
}

function renderSidebar(){
  document.getElementById("aptList").innerHTML = S.apts.map(a=>`
    <div class="apt-item${a.id===S.cur?.id?" active":""}" onclick="switchApt('${a.id}')">
      <div class="apt-dot"></div>${a.name}</div>`).join("");
}

function switchApt(id){ S.cur=S.apts.find(a=>a.id===id); renderSidebar(); loadDash(S.cur); }

async function loadDash(apt){
  S.charts.forEach(c=>{try{c.destroy()}catch(e){}});
  S.charts=[];
  document.getElementById("mainContent").innerHTML=`<div class="loading">Caricamento dati per ${apt.name}...</div>`;
  const now=new Date();
  const from=new Date(now); from.setMonth(from.getMonth()-11);
  const fmt=d=>d.toISOString().slice(0,10);
  try{
    const d = await api(`reservations?apartmentId=${apt.id}&arrivalFrom=${fmt(from)}&departureFrom=${fmt(from)}&pageSize=100`);
    renderDash(apt, d.bookings||[]);
  }catch(e){ document.getElementById("mainContent").innerHTML=`<div class="loading">Errore: ${e.message}</div>`; }
}

function renderDash(apt, bookings){
  const now=new Date();
  const tm=now.getMonth(); const ty=now.getFullYear();
  const rev=Array(12).fill(0), nights=Array(12).fill(0);
  bookings.forEach(b=>{
    const arr=new Date(b.arrival);
    const mi=((arr.getMonth()-tm+12)%12);
    if(b.price) rev[mi]+=Number(b.price)||0;
    if(b.nights) nights[mi]+=Number(b.nights)||0;
  });
  const revD=rev.map(v=>Math.round(v));
  const expD=revD.map(v=>Math.round(v*0.22));
  const netD=revD.map((v,i)=>v-expD[i]);
  const occD=nights.map(n=>Math.min(100,Math.round((n/30)*100)));

  const lr=revD[11],le=expD[11],ln=netD[11],lo=occD[11];
  const pr=revD[10],pn=netD[10],po=occD[10];
  const fe=(a,b)=>{const d=a-b;return(d>=0?"+":"")+"€"+Math.abs(d).toLocaleString("it");};
  const fd=(a,b)=>{const d=a-b;return(d>=0?"+":"")+d;};

  const upcoming=bookings.filter(b=>new Date(b.departure)>=now).sort((a,b)=>new Date(a.arrival)-new Date(b.arrival)).slice(0,5);
  const fd2=s=>{const d=new Date(s);return d.getDate()+" "+MN[d.getMonth()];};
  const isAct=b=>new Date(b.arrival)<=now&&new Date(b.departure)>=now;
  const chN=b=>b.channel?.name||"Diretto";

  const bHtml=upcoming.length?upcoming.map(b=>`
    <div class="brow">
      <div><div style="font-weight:500">${b.firstname||""} ${b.lastname||""}</div><div style="font-size:11px;color:#888780">${fd2(b.arrival)} → ${fd2(b.departure)} · ${b.nights||"?"} notti</div></div>
      <div><span class="tag ${chN(b)==='Airbnb'?'ta':'tbk'}">${chN(b)}</span></div>
      <div style="font-weight:500">€${Math.round(b.price||0).toLocaleString("it")}</div>
      <div><span class="tag ${isAct(b)?'tg':'tb'}">${isAct(b)?'In corso':'Confermata'}</span></div>
    </div>`).join(""):`<p style="font-size:13px;color:#888780;padding:10px 0">Nessuna prenotazione trovata</p>`;

  document.getElementById("mainContent").innerHTML=`
    <div style="font-size:20px;font-weight:500;margin-bottom:4px">${apt.name}</div>
    <p style="font-size:13px;color:#888780;margin-bottom:20px"><span style="background:#EAF3DE;color:#3B6D11;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500">Live</span> Dati da Smoobu · ${MF[tm]} ${ty}</p>
    <div class="metrics">
      <div class="metric"><div class="ml">Entrate lorde</div><div class="mv">€${lr.toLocaleString("it")}</div><div class="md ${lr>=pr?'up':'dn'}">${fe(lr,pr)} vs mese prec.</div></div>
      <div class="metric"><div class="ml">Spese stimate</div><div class="mv">€${le.toLocaleString("it")}</div><div class="md" style="color:#888780">~22% dei ricavi</div></div>
      <div class="metric"><div class="ml">Entrate nette</div><div class="mv">€${ln.toLocaleString("it")}</div><div class="md ${ln>=pn?'up':'dn'}">${fe(ln,pn)} vs mese prec.</div></div>
      <div class="metric"><div class="ml">Occupazione</div><div class="mv">${lo}%</div><div class="md ${lo>=po?'up':'dn'}">${fd(lo,po)}pt vs mese prec.</div></div>
    </div>
    <div class="charts-grid">
      <div class="card"><div class="ct">Occupazione mensile (%)</div><div style="position:relative;height:170px"><canvas id="occChart" role="img" aria-label="Occupazione">Dati occupazione.</canvas></div></div>
      <div class="card">
        <div class="legend"><span><span class="ldot" style="background:#185FA5"></span>Lorde</span><span><span class="ldot" style="background:#D85A30"></span>Spese</span><span><span class="ldot" style="background:#1D9E75"></span>Netto</span></div>
        <div class="ct">Entrate e spese (€)</div>
        <div style="position:relative;height:170px"><canvas id="revChart" role="img" aria-label="Entrate spese">Dati entrate.</canvas></div>
      </div>
    </div>
    <div class="card"><div class="ct">Prenotazioni in corso e prossime</div>${bHtml}</div>`;

  requestAnimationFrame(()=>{
    S.charts.push(new Chart(document.getElementById("occChart"),{
      type:"line",
      data:{labels:MN,datasets:[{data:occD,borderColor:"#185FA5",backgroundColor:"rgba(24,95,165,0.07)",tension:0.4,fill:true,pointRadius:2,pointBackgroundColor:"#185FA5"}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+"%",font:{size:10},color:"#888780"},grid:{color:"rgba(0,0,0,0.05)"}},x:{ticks:{font:{size:10},color:"#888780",autoSkip:false,maxRotation:0},grid:{display:false}}}}
    }));
    S.charts.push(new Chart(document.getElementById("revChart"),{
      type:"bar",
      data:{labels:MN,datasets:[
        {data:revD,backgroundColor:"rgba(24,95,165,0.65)",borderRadius:2,borderSkipped:false},
        {data:expD,backgroundColor:"rgba(216,90,48,0.65)",borderRadius:2,borderSkipped:false},
        {data:netD,type:"line",borderColor:"#1D9E75",backgroundColor:"transparent",tension:0.4,pointRadius:2,pointBackgroundColor:"#1D9E75"}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"€"+(v/1000).toFixed(1)+"k",font:{size:10},color:"#888780"},grid:{color:"rgba(0,0,0,0.05)"}},x:{ticks:{font:{size:10},color:"#888780",autoSkip:false,maxRotation:0},grid:{display:false}}}}
    }));
  });
}
</script>
</body>
</html>
