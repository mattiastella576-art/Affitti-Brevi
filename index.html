<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5B2D8E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prisma Retreats">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Prisma Retreats — Dashboard Proprietari</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-box{background:#fff;border-radius:16px;border:0.5px solid #e0dfd8;padding:2rem;width:100%;max-width:380px}
label{font-size:13px;color:#5f5e5a;display:block;margin-bottom:6px}
input{width:100%;padding:9px 12px;border:0.5px solid #d3d1c7;border-radius:8px;font-size:14px;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s}
input:focus{border-color:#5B2D8E}
.field{margin-bottom:16px}
.btn{width:100%;padding:10px;background:#5B2D8E;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:#3D1A6E}
.err{color:#A32D2D;font-size:12px;margin-top:10px;display:none}
.app{display:none}
.sidebar{width:220px;background:#fff;border-right:0.5px solid #e0dfd8;min-height:100vh;padding:1.25rem 1rem;position:fixed;top:0;left:0;z-index:10}
.main{margin-left:220px;padding:1.5rem;max-width:1000px}
.s-label{font-size:10px;color:#888780;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 8px;font-weight:500;display:block}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px;color:#5f5e5a;margin-bottom:2px}
.nav-item:hover{background:#f5f5f3}
.nav-item.active{background:#F0E6F6;color:#5B2D8E;font-weight:500}
.apt-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px;color:#5f5e5a;margin-bottom:2px}
.apt-item:hover{background:#f5f5f3}
.apt-item.active{background:#F0E6F6;color:#5B2D8E;font-weight:500}
.apt-dot{width:8px;height:8px;border-radius:50%;background:#d3d1c7;flex-shrink:0}
.apt-item.active .apt-dot{background:#5B2D8E}
.s-footer{position:absolute;bottom:1.25rem;left:1rem;right:1rem}
.avatar{width:28px;height:28px;border-radius:50%;background:#F0E6F6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#5B2D8E;flex-shrink:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#f5f5f3;border-radius:8px;padding:14px 16px}
.metric.green{background:#EAF3DE}
.metric.purple{background:#F0E6F6}
.ml{font-size:11px;color:#888780;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.metric.green .ml{color:#3B6D11}
.metric.purple .ml{color:#5B2D8E}
.mv{font-size:21px;font-weight:500}
.md{font-size:11px;margin-top:3px}
.up{color:#1D9E75}.dn{color:#D85A30}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#fff;border:0.5px solid #e0dfd8;border-radius:12px;padding:16px;margin-bottom:14px}
.ct{font-size:12px;color:#888780;text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:#888780}
.legend span{display:flex;align-items:center;gap:5px}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block}
.brow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:0.5px solid #e0dfd8;font-size:13px}
.brow:last-child{border-bottom:none}
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.tg{background:#EAF3DE;color:#3B6D11}
.tb{background:#F0E6F6;color:#5B2D8E}
.ta{background:#FFE0D3;color:#993C1D}
.tbk{background:#F0E6F6;color:#3D1A6E}
.loading{text-align:center;padding:3rem;color:#888780;font-size:14px}
.bdrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;color:#5f5e5a;border-bottom:0.5px solid #f0efe8}
.bdrow:last-child{border-bottom:none}
.bdrow.neg span:last-child{color:#D85A30}
.bdrow.total{font-weight:500;font-size:14px;color:#1a1a18;border-top:1px solid #e0dfd8;margin-top:4px;padding-top:10px;border-bottom:none}
.bdrow.total span:last-child{color:#1D9E75;font-size:16px}
.hero-card{position:relative;border-radius:16px;overflow:hidden;margin-bottom:20px}
.hero-img{width:100%;height:220px;object-fit:cover;display:block}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(91,45,142,0.4) 0%,rgba(91,45,142,0.85) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.hero-greeting{color:#fff;font-size:26px;font-weight:600;margin-bottom:4px}
.hero-sub{color:rgba(255,255,255,0.8);font-size:14px}
.home-apt-card{background:#fff;border:0.5px solid #e0dfd8;border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s}
.home-apt-card:hover{box-shadow:0 2px 12px rgba(91,45,142,0.12)}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav button{background:#F0E6F6;border:none;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;color:#5B2D8E;font-weight:600;display:flex;align-items:center;justify-content:center}
.month-nav button:hover{background:#5B2D8E;color:#fff}
.month-nav button:disabled{opacity:0.3;cursor:default;background:#f5f5f3}
@media(max-width:680px){.sidebar{display:none}.main{margin-left:0;padding:1rem}.charts-grid{grid-template-columns:1fr}.brow{grid-template-columns:1fr auto}.hero-greeting{font-size:22px}}
</style>
</head>

function buildMonthLabels(){
  const now=new Date(),labels=[],mn=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
  for(let i=CUR_IDX;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push(mn[d.getMonth()]+" '"+String(d.getFullYear()).slice(2));}
  for(let i=1;i<=TOTAL_MONTHS-CUR_IDX-1;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);labels.push(mn[d.getMonth()]+" '"+String(d.getFullYear()).slice(2));}
  return labels;
}
function getMonthIndex(dateStr){
  const now=new Date(),parts=String(dateStr).split(/[-T]/),d=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2])||1);
  if(isNaN(d.getTime()))return -1;
  const idx=CUR_IDX-((now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth());
  return(idx>=0&&idx<TOTAL_MONTHS)?idx:-1;
}
function calcPrenotazione(price,channelName,cleaningFee,fiscal){
  const lordo=Number(price)||0,isSRL=fiscal.regime==="srl",ch=(channelName||"").toLowerCase();
  let commPortale=0;
  if(ch.includes("airbnb"))commPortale=lordo*(isSRL?AIRBNB_SRL:AIRBNB);
  else if(ch.includes("booking"))commPortale=lordo*(isSRL?BOOKING_SRL:BOOKING);
  const cedolare=fiscal.regime==="cedolare"?lordo*(fiscal.cedolare||0.21):0;
  const pulizie=fiscal.pulizie?(Number(cleaningFee)||0):0;
  return{lordo,commPortale,cedolare,pulizie};
}

async function api(ep){const r=await fetch(`/api/smoobu?endpoint=${encodeURIComponent(ep)}`);if(!r.ok)throw new Error("API error");return r.json();}

function doLogin(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase(),pass=document.getElementById("loginPass").value,u=USERS[email];
  if(!u||u.password!==pass){document.getElementById("loginErr").style.display="block";return;}
  S.user={...u,email};
  document.getElementById("loginErr").style.display="none";
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appScreen").style.display="block";
  document.getElementById("userName").textContent=u.name;
  document.getElementById("userAvatar").textContent=u.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  loadApts();
}
function logout(){
  S={user:null,apts:[],cur:null,charts:[],view:"home",allData:{},currentViewIdx:CUR_IDX};
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("appScreen").style.display="none";
  document.getElementById("loginEmail").value="";document.getElementById("loginPass").value="";
}

async function loadApts(){
  try{
    const d=await api("apartments");
    let apts=(d.apartments||[]).map(a=>({id:String(a.id),name:a.name||"Appartamento"}));
    if(S.user.apartments)apts=apts.filter(a=>S.user.apartments.includes(a.id));
    S.apts=apts;S.cur=null;S.view="home";renderSidebar();showHome();
  }catch(e){document.getElementById("mainContent").innerHTML=`<div class="loading">Errore: ${e.message}</div>`;}
}
function renderSidebar(){
  document.getElementById("navHome").className="nav-item"+(S.view==="home"?" active":"");
  document.getElementById("aptList").innerHTML=S.apts.map(a=>`
    <div class="apt-item${a.id===S.cur?.id&&S.view==="dash"?" active":""}" onclick="switchApt('${a.id}')">
      <div class="apt-dot"></div>${a.name}</div>`).join("");
}
function goHome(){S.cur=null;S.view="home";renderSidebar();showHome();}
function switchApt(id){S.cur=S.apts.find(a=>a.id===id);S.view="dash";renderSidebar();loadDash(S.cur);}

async function showHome(){
  S.charts.forEach(c=>{try{c.destroy()}catch(e){}});S.charts=[];
  const mc=document.getElementById("mainContent");
  mc.innerHTML=`<div class="loading">Caricamento riepilogo...</div>`;
  const now=new Date(),from=new Date(now);from.setMonth(from.getMonth()-11);
  const f=d=>d.toISOString().slice(0,10);
  const firstName=S.user.name.split(" ")[0];
  let totalLordo=0,totalNetto=0,totalNights=0,activeBookings=0;
  let aptSummaries=[];

  for(const apt of S.apts){
    const fiscal=getFiscalForApt(apt.id);
    let allB=[],page=1,more=true;
    while(more){
      const d=await api(`reservations?apartmentId=${apt.id}&arrivalFrom=${f(from)}&departureFrom=${f(from)}&pageSize=100&page=${page}`);
      const bk=d.bookings||[];allB=allB.concat(bk);if(bk.length<100)more=false;else page++;
    }
    let aL=0,aCP=0,aCd=0,aPl=0,aN=0,aAct=0;
    allB.forEach(b=>{
      if(!b.price||Number(b.price)<=0)return;
      const mi=getMonthIndex(b.arrival);if(mi!==CUR_IDX)return;
      const r=calcPrenotazione(b.price,b.channel?.name||"",b.cleaning_fee||0,fiscal);
      aL+=r.lordo;aCP+=r.commPortale;aCd+=r.cedolare;aPl+=r.pulizie;
      aN+=calcNights(b.arrival,b.departure);
    });
    allB.forEach(b=>{if(new Date(b.arrival)<=now&&new Date(b.departure)>=now&&b.price&&Number(b.price)>0)aAct++;});
    const aCG=(aL-aCP-aCd)*(fiscal.gestione||0);
    const aSp=aCP+aCd+aPl+aCG;
    const aNet=aL-aSp;
    const aOcc=Math.min(100,Math.round((aN/30)*100));
    totalLordo+=aL;totalNetto+=aNet;totalNights+=aN;activeBookings+=aAct;
    aptSummaries.push({...apt,lordo:aL,netto:aNet,occ:aOcc,active:aAct});
  }

  const totalOcc=S.apts.length>0?Math.min(100,Math.round((totalNights/(30*S.apts.length))*100)):0;
  const curMN=MFL[now.getMonth()]+" "+now.getFullYear();
  const aptCards=aptSummaries.map(a=>`
    <div class="home-apt-card" onclick="switchApt('${a.id}')">
      <div style="font-size:14px;font-weight:500;margin-bottom:8px">${a.name}</div>
      <div style="display:flex;gap:16px;font-size:12px;color:#888780;flex-wrap:wrap">
        <div><span style="color:#1a1a18;font-weight:500">${fmtE(a.lordo)}</span> lordo</div>
        <div><span style="color:#1D9E75;font-weight:500">${fmtE(a.netto)}</span> netto</div>
        <div>${a.occ}% occ.</div>
        ${a.active>0?`<span class="tag tg">${a.active} in corso</span>`:""}
      </div>
    </div>`).join("");

  mc.innerHTML=`
    <div class="hero-card">
      <img class="hero-img" src="${HERO_IMG}" alt="">
      <div class="hero-overlay">
        <div class="hero-greeting">${getGreeting()}, ${firstName}</div>
        <div class="hero-sub">Ecco il riepilogo dei tuoi appartamenti \u2014 ${curMN}</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric purple"><div class="ml">Entrate lorde totali</div><div class="mv" style="color:#5B2D8E">${fmtE(totalLordo)}</div><div class="md" style="color:#888780">${curMN}</div></div>
      <div class="metric green"><div class="ml">Netto totale</div><div class="mv" style="color:#1D9E75">${fmtE(totalNetto)}</div><div class="md" style="color:#888780">${curMN}</div></div>
      <div class="metric"><div class="ml">Occupazione media</div><div class="mv">${totalOcc}%</div><div class="md" style="color:#888780">${S.apts.length} appartament${S.apts.length===1?"o":"i"}</div></div>
      <div class="metric"><div class="ml">Soggiorni attivi</div><div class="mv">${activeBookings}</div><div class="md" style="color:#888780">In questo momento</div></div>
    </div>
    <div class="ct" style="margin-bottom:12px">I tuoi appartamenti</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">${aptCards}</div>`;
}

async function loadDash(apt){
  S.charts.forEach(c=>{try{c.destroy()}catch(e){}});S.charts=[];
  document.getElementById("mainContent").innerHTML=`<div class="loading">Caricamento dati per ${apt.name}...</div>`;
  const now=new Date(),from=new Date(now);from.setMonth(from.getMonth()-11);
  const yoyFrom=new Date(now.getFullYear()-1,now.getMonth(),1);
  const f=d=>d.toISOString().slice(0,10);
  try{
    let allB=[],page=1,more=true;
    while(more){const d=await api(`reservations?apartmentId=${apt.id}&arrivalFrom=${f(from)}&departureFrom=${f(from)}&pageSize=100&page=${page}`);const bk=d.bookings||[];allB=allB.concat(bk);if(bk.length<100)more=false;else page++;}
    let yoyRaw=[],p2=1,m2=true;
    while(m2){const d=await api(`reservations?apartmentId=${apt.id}&arrivalFrom=${f(yoyFrom)}&departureFrom=${f(yoyFrom)}&pageSize=100&page=${p2}`);const bk=d.bookings||[];yoyRaw=yoyRaw.concat(bk);if(bk.length<100)m2=false;else p2++;}
    const ym=yoyFrom.getMonth(),yy=yoyFrom.getFullYear();
    const yoyB=yoyRaw.filter(b=>{const p=String(b.arrival).split(/[-T]/);return Number(p[1])-1===ym&&Number(p[0])===yy;});
    S.allData[apt.id]={bookings:allB,yoyBookings:yoyB};
    renderDash(apt,allB,yoyB,CUR_IDX);
  }catch(e){document.getElementById("mainContent").innerHTML=`<div class="loading">Errore: ${e.message}</div>`;}
}

function renderDash(apt,bookings,yoyBookings,viewIdx){
  const now=new Date(),fiscal=getFiscalForApt(apt.id),monthLabels=buildMonthLabels();
  const mL=Array(TOTAL_MONTHS).fill(0),mCP=Array(TOTAL_MONTHS).fill(0),mCd=Array(TOTAL_MONTHS).fill(0),mPl=Array(TOTAL_MONTHS).fill(0),mN=Array(TOTAL_MONTHS).fill(0);

  bookings.forEach(b=>{
    if(!b.price||Number(b.price)<=0)return;const mi=getMonthIndex(b.arrival);if(mi<0)return;
    const r=calcPrenotazione(b.price,b.channel?.name||"",b.cleaning_fee||0,fiscal);
    mL[mi]+=r.lordo;mCP[mi]+=r.commPortale;mCd[mi]+=r.cedolare;mPl[mi]+=r.pulizie;mN[mi]+=calcNights(b.arrival,b.departure);
  });

  let yL=0,yCP=0,yCd=0,yPl=0;
  (yoyBookings||[]).forEach(b=>{if(!b.price||Number(b.price)<=0)return;const r=calcPrenotazione(b.price,b.channel?.name||"",b.cleaning_fee||0,fiscal);yL+=r.lordo;yCP+=r.commPortale;yCd+=r.cedolare;yPl+=r.pulizie;});
  const yCG=(yL-yCP-yCd)*(fiscal.gestione||0),ySp=yCP+yCd+yPl+yCG,yNet=yL-ySp;

  const mCG=mL.map((l,i)=>(l-mCP[i]-mCd[i])*(fiscal.gestione||0));
  const mSp=mL.map((l,i)=>mCP[i]+mCd[i]+mPl[i]+mCG[i]);
  const mNt=mL.map((l,i)=>l-mSp[i]);
  const mOc=mN.map(n=>Math.min(100,Math.round((n/30)*100)));

  const R=arr=>arr.map(v=>Math.round(v));
  const revD=R(mL),netD=R(mNt),speseD=R(mSp),commPD=R(mCP),cedD=R(mCd),commGD=R(mCG),pulD=R(mPl);

  const vr=revD[viewIdx],vn=netD[viewIdx],vo=mOc[viewIdx];
  const vCP=commPD[viewIdx],vCd=cedD[viewIdx],vCG=commGD[viewIdx],vPl=pulD[viewIdx],vSp=speseD[viewIdx];

  const vDate=new Date(now.getFullYear(),now.getMonth()-(CUR_IDX-viewIdx),1);
  const vMN=MFL[vDate.getMonth()]+" "+vDate.getFullYear();
  const curMN=MFL[now.getMonth()]+" "+now.getFullYear();
  const yoyMN=MFL[now.getMonth()]+" "+(now.getFullYear()-1);
  const regL=fiscal.regime==="cedolare"?"Cedolare secca 21%":fiscal.regime==="forfettario"?"Regime forfettario":fiscal.regime==="srl"?"SRL":"";

  let bd=`<div class="bdrow"><span>Entrate lorde</span><span style="font-weight:500">${fmtE(vr)}</span></div>
    <div class="bdrow neg"><span>Commissioni portali (Airbnb 18,91% / Booking 23,79%)</span><span>-${fmtE(vCP)}</span></div>`;
  if(fiscal.regime==="cedolare")bd+=`<div class="bdrow neg"><span>Cedolare secca 21%</span><span>-${fmtE(vCd)}</span></div>`;
  if(fiscal.pulizie)bd+=`<div class="bdrow neg"><span>Spese pulizie</span><span>-${fmtE(vPl)}</span></div>`;
  bd+=`<div class="bdrow neg"><span>Gestione Prisma (${Math.round((fiscal.gestione||0)*100)}% sul netto portali)</span><span>-${fmtE(vCG)}</span></div>`;
  bd+=`<div class="bdrow"><span style="color:#888780;font-size:12px">Totale spese e trattenute</span><span style="color:#D85A30">-${fmtE(vSp)}</span></div>`;
  bd+=`<div class="bdrow total"><span>Netto proprietario</span><span>${fmtE(vn)}</span></div>`;

  if(viewIdx===CUR_IDX){
    const dL=vr-Math.round(yL),dN=vn-Math.round(yNet);
    bd+=`<div style="margin-top:14px;padding-top:12px;border-top:0.5px solid #e0dfd8">
      <div style="font-size:11px;color:#888780;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;font-weight:500">Confronto con ${yoyMN}</div>
      <div class="bdrow"><span>Lordo ${yoyMN}</span><span style="font-weight:500">${fmtE(Math.round(yL))}</span></div>
      <div class="bdrow"><span>Lordo ${curMN}</span><span style="font-weight:500">${fmtE(vr)}</span></div>
      <div class="bdrow"><span>Differenza lordo</span><span class="${dL>=0?"up":"dn"}" style="font-weight:500">${dL>=0?"+":""}${fmtE(Math.abs(dL))}</span></div>
      <div class="bdrow"><span>Netto ${yoyMN}</span><span style="font-weight:500">${fmtE(Math.round(yNet))}</span></div>
      <div class="bdrow"><span>Netto ${curMN}</span><span style="font-weight:500">${fmtE(vn)}</span></div>
      <div class="bdrow"><span>Differenza netto</span><span class="${dN>=0?"up":"dn"}" style="font-weight:500">${dN>=0?"+":""}${fmtE(Math.abs(dN))}</span></div>
    </div>`;
  }

  const upcoming=bookings.filter(b=>new Date(b.departure)>=now&&b.price&&Number(b.price)>0).sort((a,b)=>new Date(a.arrival)-new Date(b.arrival)).slice(0,6);
  const fd2=s=>{const d=new Date(s);return d.getDate()+" "+["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"][d.getMonth()];};
  const isAct=b=>new Date(b.arrival)<=now&&new Date(b.departure)>=now;
  const chN=b=>b.channel?.name||"Diretto";
  const bH=upcoming.length?upcoming.map(b=>`
    <div class="brow">
      <div><div style="font-weight:500">${b.firstname||""} ${b.lastname||""}</div>
      <div style="font-size:11px;color:#888780">${fd2(b.arrival)} \u2192 ${fd2(b.departure)} \u00b7 ${calcNights(b.arrival,b.departure)} notti</div></div>
      <div><span class="tag ${chN(b).toLowerCase().includes('airbnb')?'ta':'tbk'}">${chN(b)}</span></div>
      <div style="font-weight:500">${fmtE(Number(b.price||0))} <span style="font-size:10px;color:#888780;font-weight:400">lordo</span></div>
      <div><span class="tag ${isAct(b)?'tg':'tb'}">${isAct(b)?'In corso':'Confermata'}</span></div>
    </div>`).join(""):`<p style="font-size:13px;color:#888780;padding:10px 0">Nessuna prenotazione trovata</p>`;

  const lr=revD[CUR_IDX],ln=netD[CUR_IDX],lo=mOc[CUR_IDX];
  const pr=revD[CUR_IDX-1],pn=netD[CUR_IDX-1],po=mOc[CUR_IDX-1];
  const tCP=commPD[CUR_IDX],tCd=cedD[CUR_IDX],tCG=commGD[CUR_IDX],tPl=pulD[CUR_IDX];

  document.getElementById("mainContent").innerHTML=`
    <div style="font-size:20px;font-weight:500;margin-bottom:4px">${apt.name}</div>
    <p style="font-size:13px;color:#888780;margin-bottom:20px">
      <span style="background:#EAF3DE;color:#3B6D11;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500">Live</span>
      ${regL?`<span style="background:#F0E6F6;color:#5B2D8E;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;margin-left:6px">${regL}</span>`:""}
      <span style="margin-left:6px">Smoobu \u00b7 ${curMN}</span>
    </p>
    <div class="metrics">
      <div class="metric"><div class="ml">Entrate lorde</div><div class="mv">${fmtE(lr)}</div><div class="md ${lr>=pr?'up':'dn'}">${fmtDE(lr,pr)} vs mese prec.</div></div>
      <div class="metric"><div class="ml">Comm. portali</div><div class="mv">${fmtE(tCP)}</div><div class="md" style="color:#888780">Airbnb / Booking</div></div>
      ${fiscal.regime==="cedolare"?`<div class="metric"><div class="ml">Cedolare secca</div><div class="mv">${fmtE(tCd)}</div><div class="md" style="color:#888780">21% sul lordo</div></div>`:""}
      ${fiscal.pulizie?`<div class="metric"><div class="ml">Pulizie</div><div class="mv">${fmtE(tPl)}</div><div class="md" style="color:#888780">Da Smoobu</div></div>`:""}
      <div class="metric"><div class="ml">Gestione Prisma</div><div class="mv">${fmtE(tCG)}</div><div class="md" style="color:#888780">${Math.round((fiscal.gestione||0)*100)}% sul netto portali</div></div>
      <div class="metric green"><div class="ml">Netto proprietario</div><div class="mv" style="color:#1D9E75">${fmtE(ln)}</div><div class="md ${ln>=pn?'up':'dn'}">${fmtDE(ln,pn)} vs mese prec.</div></div>
      <div class="metric"><div class="ml">Occupazione</div><div class="mv">${lo}%</div><div class="md ${lo>=po?'up':'dn'}">${fmtPt(lo,po)} vs mese prec.</div></div>
    </div>
    <div class="card">
      <div class="month-nav">
        <button onclick="changeMonth(-1)" ${viewIdx<=0?"disabled":""}>&#8592;</button>
        <div class="ct" style="margin-bottom:0">Riepilogo economico \u2014 ${vMN}</div>
        <button onclick="changeMonth(1)" ${viewIdx>=TOTAL_MONTHS-1?"disabled":""}>&#8594;</button>
      </div>
      ${bd}
    </div>
    <div class="charts-grid">
      <div class="card" style="margin-bottom:0"><div class="ct">Occupazione (%)</div><div style="position:relative;height:180px"><canvas id="occChart"></canvas></div></div>
      <div class="card" style="margin-bottom:0">
        <div class="legend"><span><span class="ldot" style="background:#5B2D8E"></span>Lordo</span><span><span class="ldot" style="background:#D85A30"></span>Spese</span><span><span class="ldot" style="background:#1D9E75"></span>Netto</span><span><span class="ldot" style="background:rgba(91,45,142,0.2);border:1px dashed #5B2D8E"></span>Previsione</span></div>
        <div class="ct">Lordo vs spese vs netto (\u20ac)</div>
        <div style="position:relative;height:180px"><canvas id="revChart"></canvas></div>
      </div>
    </div>
    <div style="margin-bottom:14px"></div>
    <div class="card"><div class="ct">Prenotazioni in corso e prossime</div>${bH}</div>`;

  S.currentViewIdx=viewIdx;
  requestAnimationFrame(()=>{
    const rBg=revD.map((_,i)=>i<=CUR_IDX?"rgba(91,45,142,0.45)":"rgba(91,45,142,0.2)");
    const sBg=speseD.map((_,i)=>i<=CUR_IDX?"rgba(216,90,48,0.6)":"rgba(216,90,48,0.25)");
    S.charts.push(new Chart(document.getElementById("occChart"),{
      type:"line",data:{labels:monthLabels,datasets:[{data:mOc,borderColor:"#5B2D8E",backgroundColor:"rgba(91,45,142,0.07)",tension:0.4,fill:true,pointRadius:2,pointBackgroundColor:"#5B2D8E",segment:{borderDash:ctx=>ctx.p0DataIndex>=CUR_IDX?[5,3]:undefined,borderColor:ctx=>ctx.p0DataIndex>=CUR_IDX?"rgba(91,45,142,0.4)":"#5B2D8E"}}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+"%",font:{size:10},color:"#888780"},grid:{color:"rgba(0,0,0,0.05)"}},x:{ticks:{font:{size:10},color:"#888780",autoSkip:false,maxRotation:45},grid:{display:false}}}}
    }));
    S.charts.push(new Chart(document.getElementById("revChart"),{
      type:"bar",data:{labels:monthLabels,datasets:[
        {data:revD,backgroundColor:rBg,borderRadius:2,borderSkipped:false,label:"Lordo"},
        {data:speseD,backgroundColor:sBg,borderRadius:2,borderSkipped:false,label:"Spese"},
        {data:netD,type:"line",borderColor:"#1D9E75",backgroundColor:"transparent",tension:0.4,pointRadius:2,pointBackgroundColor:"#1D9E75",label:"Netto",segment:{borderDash:ctx=>ctx.p0DataIndex>=CUR_IDX?[5,3]:undefined,borderColor:ctx=>ctx.p0DataIndex>=CUR_IDX?"rgba(29,158,117,0.4)":"#1D9E75"}}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"\u20ac"+(v/1000).toFixed(1)+"k",font:{size:10},color:"#888780"},grid:{color:"rgba(0,0,0,0.05)"}},x:{ticks:{font:{size:10},color:"#888780",autoSkip:false,maxRotation:45},grid:{display:false}}}}
    }));
  });
}
function changeMonth(dir){
  const ni=S.currentViewIdx+dir;if(ni<0||ni>=TOTAL_MONTHS)return;
  const d=S.allData[S.cur.id];if(d)renderDash(S.cur,d.bookings,d.yoyBookings,ni);
}
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
